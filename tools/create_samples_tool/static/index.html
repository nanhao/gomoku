<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>create_samples 验收工具</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-header">create_samples 验收工具</div>

<div class="app-main">
    <!-- ===== 左侧面板 ===== -->
    <div class="left-panel">
        <!-- 参数区 -->
        <div class="param-section">
            <h2>参数配置</h2>
            <div class="param-row">
                <label>model</label>
                <select id="modelSelect">
                    <option value="" disabled selected>— 请选择模型 —</option>
                </select>
            </div>
            <div class="param-row"><label>mode</label><select id="modeSelect"><option value="winning_move" selected>winning_move</option><option value="winner_path">winner_path</option></select></div>
            <div class="param-row"><label>games</label><input id="gamesInput" type="number" placeholder="可选，对局数（默认100）"></div>
            <div class="param-row"><label>sample_games</label><input id="sampleGamesInput" type="number" placeholder="可选，目标样本局数"></div>
            <div class="param-row"><label>output <span class="required-mark">*</span></label><input id="outputInput" type="text" placeholder="必填，如 ai/train_data/samples.json" required></div>
            <div class="param-row"><label>数据增强</label><div class="switch-wrap"><input id="noAugmentCheck" type="checkbox"><span class="switch-label">禁用 (--no-augment)</span></div></div>
            <div class="param-row"><label>温度采样</label><div class="switch-wrap"><input id="noTempSamplingCheck" type="checkbox"><span class="switch-label">禁用 (--no-temp-sampling)</span></div></div>
            <div class="param-row"><label>temperature</label><input id="temperatureInput" type="number" value="1.0" step="0.1" min="0.01"></div>
            <div class="param-row"><label>temp-moves</label><input id="tempMovesInput" type="number" value="12" min="0"></div>
            <div class="param-row"><label>temp-side</label><select id="tempSideSelect"><option value="both" selected>both</option><option value="black">black</option><option value="white">white</option><option value="random">random</option></select></div>
            <div class="param-row"><label>temp-seed</label><input id="tempSeedInput" type="number" placeholder="可选，用于复现"></div>
            <button class="btn-run" id="btnRun">▶ 执行</button>
        </div>

        <!-- 脚本输出区 -->
        <div class="script-output-section">
            <h2>脚本输出</h2>
            <div class="script-output-content" id="scriptOutput">
                <span class="script-output-hint">请先执行脚本</span>
            </div>
        </div>

        <!-- 温度信息区 -->
        <div class="temp-info-section">
            <h2>温度采样信息</h2>
            <div id="tempInfoContent">
                <span class="temp-info-hint">请先执行脚本</span>
            </div>
        </div>

        <!-- 对局列表区 -->
        <div class="game-list-section">
            <h2>对局列表 <span id="gameCountLabel" style="font-size:12px;color:#888"></span></h2>
            <div id="gameListContent">
                <span class="game-list-hint">请先执行脚本</span>
            </div>
        </div>
    </div>

    <!-- ===== 热力图区 ===== -->
    <div class="right-panel">
        <h2 id="heatmapTitle">热力图对比</h2>
        <div class="legend-row" id="legendRow" style="display:none">
            <span class="legend-gradient"></span><span>热力图（白→黄→橙→红）</span>
            <span class="legend-swatch green-border"></span><span>落子位（粗绿框，不画棋子）</span>
            <span class="legend-swatch stone-black"></span><span>黑棋</span>
            <span class="legend-swatch stone-white"></span><span>白棋</span>
            <span class="legend-swatch board-bg"></span><span>棋盘底色</span>
        </div>
        <div id="heatmapHint" class="heatmap-hint">请先执行脚本并选择对局</div>
        <div class="heatmap-container" id="heatmapContainer"></div>
    </div>
</div>

<!-- Tooltip -->
<div class="heatmap-tooltip" id="heatmapTooltip"></div>

<script src="app.js"></script>
</body>
</html>
